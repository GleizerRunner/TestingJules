<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Person Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>AI Person Analyzer</h1>

    <input type="file" id="imageUpload" accept="image/*">
    
    <div id="imageContainer">
        <img id="uploadedImage" src="#" alt="Uploaded Image" style="max-width: 500px; display: none;"/>
    </div>

    <h2>Analysis Results:</h2>
    <div id="results">
        <p><strong>Status:</strong> <span id="status">Awaiting image...</span></p>
        <p><strong>Detected Faces:</strong> <span id="faceCount">0</span></p>
        
        <div id="analysisResultsContainer" style="display: none;">
            <p><strong>Age:</strong> <span id="ageResult">-</span></p>
            <p><strong>Predicted Gender:</strong> <span id="genderResult">-</span></p>
            <p><strong>Predicted Emotion:</strong> <span id="emotionResult">-</span></p>
            <p><strong>Estimated Skin Tone (Average):</strong> <span id="skinColorResult">-</span></p>
            <p><strong>Visual Health Cues:</strong> <span id="healthCuesResult">-</span></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@latest/dist/face-api.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
